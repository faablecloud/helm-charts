{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: {{ .Values.sentinel.enabled | ternary .Values.sentinel.replicaCount 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  {{- if .Values.sentinel.enabled }}
  # Let Sentinel INFO each restarted replica (every 10 s) before the rollout
  # moves on: the last pods to roll can be the master, and its failover needs
  # a replica Sentinel already considers good.
  minReadySeconds: {{ .Values.sentinel.minReadySeconds }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll the data pods when redis.conf / redis.sh change — and ONLY
        # then: sentinel.conf / sentinel.sh edits must not restart the data
        # pods (see "redis.checksum" in _helpers.tpl).
        checksum/config: {{ include "redis.checksum" (list $ "redis.conf" "redis.sh") }}
    spec:
      {{- include "redis.affinity" (list $ "redis" (.Values.sentinel.enabled | ternary .Values.podAntiAffinity.redis "")) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["sh", "/conf/redis.sh"]
          env:
            - name: REDIS_PASSWORD
              value: {{ .Values.auth.password | quote }}
            - name: REDIS_SENTINEL_MASTER_NAME
              value: {{ .Values.sentinel.masterName | quote }}
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /conf
          # redis.sh may wait up to `sentinel.startupWaitSeconds` for a peer to
          # be promoted before it listens; liveness must not kill it meanwhile.
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: {{ add 12 (div .Values.sentinel.startupWaitSeconds 5) }}
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: conf
          configMap:
            name: {{ .Release.Name }}-redis-config
            defaultMode: 0755
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}

  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if or .Values.persistence.storageClass .Values.global.defaultStorageClass }}
        storageClassName: {{ .Values.persistence.storageClass | default .Values.global.defaultStorageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
{{- end -}}
