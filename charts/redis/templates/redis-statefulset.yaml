{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: {{ .Values.sentinel.enabled | ternary .Values.sentinel.replicaCount 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll the data pods whenever the redis ConfigMap changes (redis.conf /
        # redis.sh edits are otherwise never picked up).
        checksum/config: {{ include (print $.Template.BasePath "/redis-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["sh", "/conf/redis.sh"]
          env:
            - name: REDIS_PASSWORD
              value: {{ .Values.auth.password | quote }}
            - name: REDIS_SENTINEL_MASTER_NAME
              value: {{ .Values.sentinel.masterName | quote }}
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /conf
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: conf
          configMap:
            name: {{ .Release.Name }}-redis-config
            defaultMode: 0755
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}

  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if or .Values.persistence.storageClass .Values.global.defaultStorageClass }}
        storageClassName: {{ .Values.persistence.storageClass | default .Values.global.defaultStorageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
{{- end -}}
