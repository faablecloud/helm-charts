# Values for the throwaway test release. No persistence on purpose: it is the
# worst case (a pod that restarts comes back empty), the one that wiped the
# cache of deploy-prod on 2026-09-23.
sentinel:
  enabled: true
persistence:
  enabled: false
auth:
  password: testpass
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
