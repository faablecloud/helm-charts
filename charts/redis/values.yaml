# Redis/Valkey chart values.
# Consumed as a subchart: the parent maps its `redis:` subtree onto this root,
# so a parent overrides these via `redis.<key>`.
enabled: true

image:
  repository: redis
  tag: 7-alpine

auth:
  # Password applied to both Redis (`requirepass`/`masterauth`) and Sentinel.
  password: redis

# Container resources for the redis data pods. Empty = no requests/limits
# (pods become BestEffort and can starve under node pressure — set these in
# production; sentinel marks a node `+sdown` after `downAfterMilliseconds`
# without a PING reply, and a CPU-starved redis blips past that easily).
resources: {}

# Cuántas revisiones paradas guarda k8s. El default de Kubernetes es 10, pero
# ECR sólo conserva las últimas imágenes de cada repo: el historial de más
# atrás apunta a imágenes borradas y el rollback muere en ImagePullBackOff.
revisionHistoryLimit: 3

# Memory ceiling for the dataset (e.g. "256mb"). Empty = unlimited (Redis
# default). For cache-only workloads set it together with an eviction policy
# so the instance can never OOM the pod.
maxmemory: ""
maxmemoryPolicy: allkeys-lru

persistence:
  # For cache-only datasets prefer `false`: it drops the PVC (which pins each
  # replica to the node that holds its local volume) and disables RDB
  # snapshots entirely (`save ""`).
  enabled: true
  size: 4Gi
  # Empty string falls back to `global.defaultStorageClass`, then the cluster default.
  storageClass: ""

sentinel:
  # false -> single standalone StatefulSet pod.
  # true  -> StatefulSet with `replicaCount` redis pods + a Sentinel Deployment for HA failover.
  enabled: false
  replicaCount: 3
  masterName: mymaster
  # How long (ms) a master/replica must be unreachable before Sentinel flags
  # it `+sdown`. Too low and short GC/IO/CPU blips cause sdown flapping.
  downAfterMilliseconds: 10000
  # redis.sh: how long a restarting pod waits for a peer to be promoted
  # (instead of starting as an empty master) while other redis pods are alive.
  # Must exceed downAfterMilliseconds + one aborted failover's retry delay
  # (2 x failoverTimeout).
  startupWaitSeconds: 75
  # sentinel.sh: with no live master but live replicas (master restarted
  # together with the sentinels), how long to wait before promoting the most
  # up-to-date replica itself. Keep it well below startupWaitSeconds.
  promoteAfterSeconds: 15
  # Sentinel's failover-timeout (ms). A failover that aborts is not retried
  # before 2x this, so it bounds how long a master can stay down.
  failoverTimeout: 30000
  # StatefulSet minReadySeconds in Sentinel mode (see redis-statefulset.yaml).
  minReadySeconds: 15
  revisionHistoryLimit: 3
  # Container resources for the sentinel pods.
  resources: {}

# `global:` is merged in from the parent chart by Helm; declared here for documentation.
global: {}

# Affinity opcional aplicada al StatefulSet de redis y al Deployment de
# sentinel. Vacia por defecto (sin cambio de comportamiento); los consumidores
# la definen via values (ej. nodeAffinity anti control-plane en faablecore).
affinity: {}

# podAntiAffinity por hostname entre pods del mismo componente, añadida a
# `affinity`. hard = required (nunca dos en el mismo nodo; un pod se queda
# Pending si no hay nodo libre), soft = preferred, "" = sin anti-afinidad.
# Solo aplica con sentinel.enabled (en standalone hay un único pod).
podAntiAffinity:
  redis: hard
  sentinel: soft

# PodDisruptionBudget (maxUnavailable: 1) para los redis y los sentinels, para
# que un drain no se lleve dos a la vez. Solo con sentinel.enabled.
pdb:
  enabled: true
