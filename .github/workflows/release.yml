name: Release Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # Regenerate the human-facing landing page (index.html) from the Helm repo
  # index (index.yaml) that chart-releaser publishes to the gh-pages branch.
  pages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Generate index.html
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, html

          idx = yaml.safe_load(open('index.yaml')) or {}
          entries = idx.get('entries') or {}

          rows = ""
          for name, versions in sorted(entries.items()):
              v = sorted(versions, key=lambda x: x.get('created', ''), reverse=True)[0]
              desc = html.escape(v.get('description', '') or '')
              tgz = (v.get('urls') or [''])[0]
              rows += (
                  "        <tr>\n"
                  f"          <td><code>{html.escape(name)}</code></td>\n"
                  f"          <td>{html.escape(str(v.get('version','')))}</td>\n"
                  f"          <td>{html.escape(str(v.get('appVersion','')))}</td>\n"
                  f"          <td>{desc}</td>\n"
                  f'          <td><a href="{html.escape(tgz)}">.tgz</a></td>\n'
                  "        </tr>\n"
              )

          doc = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Faable Helm Charts</title>
          <style>
            :root {{ color-scheme: light dark; }}
            body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                   max-width: 820px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.6; }}
            h1 {{ display: flex; align-items: center; gap: .6rem; }}
            h1 img {{ height: 1.4em; }}
            pre {{ background: #1113; padding: 1rem; border-radius: 8px; overflow-x: auto; }}
            table {{ border-collapse: collapse; width: 100%; margin-top: 1rem; }}
            th, td {{ text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #8884; }}
            th {{ font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; opacity: .7; }}
            code {{ background: #8882; padding: .1em .35em; border-radius: 4px; }}
            footer {{ margin-top: 3rem; font-size: .85rem; opacity: .6; }}
          </style>
          </head>
          <body>
          <h1><img src="https://faable.com/logo/Emblem.png" alt="">Faable Helm Charts</h1>
          <p>Helm chart repository for Faable infrastructure.</p>
          <h2>Usage</h2>
          <pre><code>helm repo add faablecloud https://faablecloud.github.io/helm-charts
          helm repo update
          helm search repo faablecloud</code></pre>
          <h2>Charts</h2>
          <table>
            <thead>
              <tr><th>Chart</th><th>Version</th><th>App</th><th>Description</th><th>Download</th></tr>
            </thead>
            <tbody>
          {rows}    </tbody>
          </table>
          <footer>Index regenerated automatically on each release · <a href="index.yaml">index.yaml</a></footer>
          </body>
          </html>
          """
          open('index.html', 'w').write(doc)
          print("Generated index.html with", len(entries), "chart(s)")
          PY

      - name: Commit & push index.html
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged, nothing to commit"
          else
            git commit -m "docs: regenerate index.html landing page"
            git push origin gh-pages
          fi
